{% extends "base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Delete Task</h4>
        </div>

        <div class="card-body">

            <p class="fs-5">
                Are you sure you want to delete this task?
            </p>

            <table class="table table-bordered">

                <tr>
                    <th width="30%">Task</th>
                    <td>{{ task.title }}</td>
                </tr>

                <tr>
                    <th>Project</th>
                    <td>{{ project.name }}</td>
                </tr>

                <tr>
                    <th>Priority</th>
                    <td>{{ task.priority }}</td>
                </tr>

                <tr>
                    <th>Due Date</th>
                    <td>{{ task.due_date }}</td>
                </tr>

            </table>

            <form method="POST">

                {% csrf_token %}

                <a href="{% url 'task_detail' project.id task.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-danger">
                    Delete Task
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Inventory Transaction{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>New Inventory Transaction</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">
            Save Transaction
        </button>

        <a href="{% url 'inventory_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}

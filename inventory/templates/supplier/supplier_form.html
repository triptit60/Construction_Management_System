{% extends "base.html" %}

{% block title %}
    {% if form.instance.pk %}
        Edit Supplier
    {% else %}
        Add Supplier
    {% endif %}
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                {% if form.instance.pk %}
                    Edit Supplier
                {% else %}
                    Add Supplier
                {% endif %}
            </h3>
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Save Supplier
                </button>

                <a href="{% url 'supplier_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
